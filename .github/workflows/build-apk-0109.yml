name: Gerar APK Conecta Mídia 0.10.9 Identidade Estável

on:
  workflow_dispatch:
  push:
    branches: [ player-0.10.0-functional-093-autostart ]
    paths:
      - 'tools/patch_0109_stable_tv_identity.py'
      - '.github/workflows/build-apk-0109.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar base funcional 0.10.6
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/conectasolucoes/conectasign/MainActivity.kt
          G=app/build.gradle.kts
          M=app/src/main/AndroidManifest.xml
          B=app/src/main/java/com/conectasolucoes/conectasign/BootReceiver.kt
          grep -q ':8799' "$F"
          grep -q '/api/state' "$F"
          grep -q '/api/tvs' "$F"
          grep -q 'versionCode = 36' "$G"
          grep -q 'versionName = "0.10.6"' "$G"
          grep -q 'BOOT_COMPLETED' "$M"
          grep -q 'LOCKED_BOOT_COMPLETED' "$M"
          grep -q 'MY_PACKAGE_REPLACED' "$M"
          grep -q 'setAndAllowWhileIdle' "$B"

      - name: Aplicar 0.10.6
        run: |
          python tools/patch_0106_layout.py
          python tools/patch_0106_logo_sync.py

      - name: Aplicar 0.10.7 auto-sync
        run: python tools/patch_0107_auto_group_sync.py

      - name: Aplicar 0.10.8 heartbeat multi-TV
        run: python tools/patch_0108_heartbeat_multi_tv.py

      - name: Aplicar 0.10.9 identidade persistente
        run: python tools/patch_0109_stable_tv_identity.py

      - name: Validar código antes da compilação
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/conectasolucoes/conectasign/MainActivity.kt
          G=app/build.gradle.kts
          grep -q 'pairedTvId' "$F"
          grep -q 'paired_tv_id' "$F"
          grep -q 'val stableId=' "$F"
          grep -q '.put("id",stableId)' "$F"
          grep -q 'playerInstanceId' "$F"
          grep -q 'autoSyncEligible' "$F"
          grep -q 'Instant.ofEpochMilli(synchronizedNowMs()).toString()' "$F"
          grep -q 'val body=JSONObject()' "$F"
          ! grep -q 'JSONObject(tv.toString())' "$F"
          grep -q 'syncDriftMs' "$F"
          grep -q 'syncRttMs' "$F"
          grep -q 'serverClockOffsetMs' "$F"
          grep -q ':8799' "$F"
          grep -q '/api/state' "$F"
          grep -q '/api/tvs' "$F"
          ! grep -q '/api/player/config' "$F"
          ! grep -q '/api/player/heartbeat' "$F"
          ! grep -q '/api/player/proof' "$F"
          grep -q 'versionCode = 39' "$G"
          grep -q 'versionName = "0.10.9"' "$G"
          echo 'OK: identidade persistente + heartbeat multi-TV + auto-sync validados.'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validar APK compilado e assinatura
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='39'" /tmp/badging.txt
          grep -q "versionName='0.10.9'" /tmp/badging.txt
          cp "$APK" Conecta-Midia-Player-0.10.9-debug.apk
          sha256sum Conecta-Midia-Player-0.10.9-debug.apk
          echo 'OK: APK íntegro, assinado e versão confirmada.'

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Midia-Player-0.10.9-APK
          path: Conecta-Midia-Player-0.10.9-debug.apk
          if-no-files-found: error
