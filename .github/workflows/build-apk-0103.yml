name: Gerar APK Conecta Mídia 0.10.3

on:
  workflow_dispatch:
  push:
    branches: [ player-0.10.0-functional-093-autostart ]
    paths:
      - 'tools/patch_0103_visual.py'
      - '.github/workflows/build-apk-0103.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Aplicar somente visual aprovado 0.10.3
        run: python tools/patch_0103_visual.py

      - name: Validar protocolo funcional, auto-start e visual aprovado
        shell: bash
        run: |
          FILE=app/src/main/java/com/conectasolucoes/conectasign/MainActivity.kt
          BOOT=app/src/main/java/com/conectasolucoes/conectasign/BootReceiver.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          GRADLE=app/build.gradle.kts
          LAYOUT=app/src/main/res/layout/activity_main.xml
          BG=app/src/main/res/drawable/player_background.xml
          WIFI=app/src/main/res/drawable/ic_wifi_modern.xml
          PANEL=app/src/main/res/drawable/panel_bg_new.xml

          # Comunicação funcional comprovada da 0.9.3/0.10.0: NÃO alterar.
          grep -q ':8799' "$FILE"
          grep -q '/api/state' "$FILE"
          grep -q '/api/tvs' "$FILE"
          grep -q 'playSequence' "$FILE"
          grep -q 'currentMediaId' "$FILE"
          grep -q 'currentPlaylistId' "$FILE"
          grep -q 'wifiRssi' "$FILE"
          grep -q 'manufacturer' "$FILE"
          grep -q 'androidVersion' "$FILE"
          if grep -q '/api/player/config' "$FILE"; then echo 'ERRO: player/config proibido'; exit 1; fi
          if grep -q '/api/player/heartbeat' "$FILE"; then echo 'ERRO: heartbeat experimental proibido'; exit 1; fi
          if grep -q '/api/player/proof' "$FILE"; then echo 'ERRO: proof experimental proibido'; exit 1; fi
          if grep -q '8787..8810' "$FILE"; then echo 'ERRO: descoberta experimental proibida'; exit 1; fi

          # Auto-start validado fisicamente no PROSB-3000.
          grep -q 'BOOT_COMPLETED' "$BOOT"
          grep -q 'LOCKED_BOOT_COMPLETED' "$BOOT"
          grep -q 'MY_PACKAGE_REPLACED' "$BOOT"
          grep -q 'QUICKBOOT_POWERON' "$BOOT"
          grep -q 'setAndAllowWhileIdle' "$BOOT"
          grep -q 'directBootAware="true"' "$MANIFEST"
          grep -q 'launchMode="singleTask"' "$MANIFEST"

          # Visual aprovado.
          ! grep -q 'Player para Android TV' "$LAYOUT"
          ! grep -q 'Código deste dispositivo' "$LAYOUT"
          grep -q 'android:layout_marginTop="-7dp"' "$LAYOUT"
          grep -q 'android:src="@drawable/ic_wifi_modern"' "$LAYOUT"
          grep -q 'android:layout_width="235dp"' "$LAYOUT"
          grep -q 'android:layout_height="66dp"' "$LAYOUT"
          grep -q '#07175E' "$BG"
          grep -q '#16C8FF' "$BG"
          grep -q '#31DFFF' "$WIFI"
          grep -q '#101C6B' "$PANEL"
          grep -q 'Color.TRANSPARENT' "$FILE"
          grep -q '165f..255f' "$FILE"
          grep -q 'versionName = "0.10.3"' "$GRADLE"

          echo 'OK: protocolo + telemetria + auto-start preservados; visual 0.10.3 validado.'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Conecta-Midia-Player-0.10.3-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Midia-Player-0.10.3-APK
          path: Conecta-Midia-Player-0.10.3-debug.apk
          if-no-files-found: error
