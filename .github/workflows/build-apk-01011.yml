name: Gerar APK Conecta Mídia 0.10.11 Heartbeat Main Thread

on:
  workflow_dispatch:
  push:
    branches: [ player-0.10.0-functional-093-autostart ]
    paths:
      - 'tools/patch_01011_main_thread_heartbeat.py'
      - '.github/workflows/build-apk-01011.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar base funcional 0.10.6
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/conectasolucoes/conectasign/MainActivity.kt
          G=app/build.gradle.kts
          M=app/src/main/AndroidManifest.xml
          B=app/src/main/java/com/conectasolucoes/conectasign/BootReceiver.kt
          grep -q ':8799' "$F"
          grep -q '/api/state' "$F"
          grep -q '/api/tvs' "$F"
          grep -q 'versionCode = 36' "$G"
          grep -q 'versionName = "0.10.6"' "$G"
          grep -q 'BOOT_COMPLETED' "$M"
          grep -q 'LOCKED_BOOT_COMPLETED' "$M"
          grep -q 'MY_PACKAGE_REPLACED' "$M"
          grep -q 'setAndAllowWhileIdle' "$B"

      - name: Aplicar cadeia validada 0.10.6 a 0.10.10
        run: |
          python tools/patch_0106_layout.py
          python tools/patch_0106_logo_sync.py
          python tools/patch_0107_auto_group_sync.py
          python tools/patch_0108_heartbeat_multi_tv.py
          python tools/patch_0109_stable_tv_identity.py
          python tools/patch_01010_restore_heartbeat_contract.py

      - name: Aplicar correção 0.10.11 Main thread
        run: python tools/patch_01011_main_thread_heartbeat.py

      - name: Validar código antes da compilação
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/conectasolucoes/conectasign/MainActivity.kt
          G=app/build.gradle.kts
          grep -q 'CoroutineScope(SupervisorJob() + Dispatchers.Main)' "$F"
          grep -q 'val heartbeatDriftMs=runCatching{currentSyncDriftMs()}.getOrDefault(0L)' "$F"
          grep -q 'withContext(Dispatchers.IO){postHeartbeat(heartbeatDriftMs)}' "$F"
          grep -q 'private fun postHeartbeat(heartbeatDriftMs:Long):Boolean' "$F"
          grep -q '.put("syncDriftMs",heartbeatDriftMs)' "$F"
          grep -q 'JSONObject(tv.toString()).apply{remove("playerInstanceId")}' "$F"
          ! grep -q 'withContext(Dispatchers.IO){postHeartbeat()}' "$F"
          ! grep -q '.put("syncDriftMs",currentSyncDriftMs())' "$F"
          grep -q 'pairedTvId' "$F"
          grep -q 'autoSyncEligible' "$F"
          grep -q 'syncRttMs' "$F"
          grep -q 'serverClockOffsetMs' "$F"
          grep -q ':8799' "$F"
          grep -q '/api/state' "$F"
          grep -q '/api/tvs' "$F"
          ! grep -q '/api/player/config' "$F"
          ! grep -q '/api/player/heartbeat' "$F"
          ! grep -q '/api/player/proof' "$F"
          grep -q 'versionCode = 41' "$G"
          grep -q 'versionName = "0.10.11"' "$G"
          echo 'OK: ExoPlayer lido na Main; rede em IO; identidade e auto-sync preservados.'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validar APK compilado e assinatura
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'resources.arsc'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='41'" /tmp/badging.txt
          grep -q "versionName='0.10.11'" /tmp/badging.txt
          cp "$APK" Conecta-Midia-Player-0.10.11-debug.apk
          sha256sum Conecta-Midia-Player-0.10.11-debug.apk
          echo 'OK: APK íntegro, assinado e versão confirmada.'

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Midia-Player-0.10.11-APK
          path: Conecta-Midia-Player-0.10.11-debug.apk
          if-no-files-found: error
