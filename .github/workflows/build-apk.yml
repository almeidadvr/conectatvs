name: Gerar APK Conecta Mídia 0.10.1

on:
  workflow_dispatch:
  push:
    branches: [ player-0.10.0-functional-093-autostart ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Aplicar correção somente da logo
        run: python tools/patch_0101_logo.py

      - name: Validar protocolo funcional 0.9.3, auto-start e layout da logo
        shell: bash
        run: |
          FILE=app/src/main/java/com/conectasolucoes/conectasign/MainActivity.kt
          BOOT=app/src/main/java/com/conectasolucoes/conectasign/BootReceiver.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          GRADLE=app/build.gradle.kts
          LAYOUT=app/src/main/res/layout/activity_main.xml

          # Protocolo comprovadamente funcional da 0.9.3
          grep -q ':8799' "$FILE"
          grep -q '/api/state' "$FILE"
          grep -q '/api/tvs' "$FILE"
          grep -q 'playSequence' "$FILE"
          grep -q 'currentMediaId' "$FILE"
          grep -q 'currentPlaylistId' "$FILE"
          grep -q 'wifiRssi' "$FILE"
          grep -q 'manufacturer' "$FILE"
          grep -q 'androidVersion' "$FILE"

          # Impede retorno das experiências que quebraram a comunicação
          if grep -q '/api/player/config' "$FILE"; then echo 'ERRO: API player/config detectada'; exit 1; fi
          if grep -q '/api/player/heartbeat' "$FILE"; then echo 'ERRO: heartbeat experimental detectado'; exit 1; fi
          if grep -q '/api/player/proof' "$FILE"; then echo 'ERRO: proof experimental detectado'; exit 1; fi
          if grep -q '8787..8810' "$FILE"; then echo 'ERRO: descoberta experimental detectada'; exit 1; fi
          if grep -q 'CX' "$FILE"; then echo 'ERRO: diagnóstico experimental detectado'; exit 1; fi

          # Auto-start já validado fisicamente no PROSB-3000
          grep -q 'BOOT_COMPLETED' "$BOOT"
          grep -q 'LOCKED_BOOT_COMPLETED' "$BOOT"
          grep -q 'MY_PACKAGE_REPLACED' "$BOOT"
          grep -q 'QUICKBOOT_POWERON' "$BOOT"
          grep -q 'setAndAllowWhileIdle' "$BOOT"
          grep -q 'directBootAware="true"' "$MANIFEST"
          grep -q 'launchMode="singleTask"' "$MANIFEST"

          # Logo: mesmo layout e mesmo tamanho da 0.10.0
          grep -q 'android:id="@+id/brandLogo"' "$LAYOUT"
          grep -q 'android:layout_width="235dp"' "$LAYOUT"
          grep -q 'android:layout_height="66dp"' "$LAYOUT"
          grep -q 'android:src="@drawable/logo_conecta_transparente"' "$LAYOUT"
          if grep -q 'loadOfficialLogo(); requestNetworkPermissions()' "$FILE"; then echo 'ERRO: sobrescrita antiga da logo ainda ativa'; exit 1; fi

          grep -q 'versionName = "0.10.1"' "$GRADLE"
          echo 'OK: protocolo, auto-start e layout preservados; somente logo corrigida.'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Conecta-Midia-Player-0.10.1-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Midia-Player-0.10.1-APK
          path: Conecta-Midia-Player-0.10.1-debug.apk
          if-no-files-found: error
