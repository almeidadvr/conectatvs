name: Gerar APK Conecta Mídia

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Aplicar melhorias de reprodução 0.5.4
        run: python tools/patch_052.py

      - name: Aplicar melhorias profissionais 0.6.0
        run: python tools/patch_060_extra.py

      - name: Aplicar telemetria 0.6.3
        run: python tools/patch_063_device.py

      - name: Aplicar marca d'água 0.7.1
        run: python tools/patch_071_watermark.py

      - name: Aplicar suporte a logo específica 0.8.2
        run: python tools/patch_082_watermark_url.py

      - name: Melhorar compatibilidade de vídeo 0.8.5
        run: python tools/patch_085_video_compat.py

      - name: Aplicar telemetria Wi-Fi e branding 0.8.6
        run: python tools/patch_086_wifi_brand.py

      - name: Aplicar tela visual completa 0.8.6.1
        run: python tools/patch_0861_player_ui.py

      - name: Aplicar sincronização e UI responsiva 0.8.7
        run: python tools/patch_087_sync_ui.py

      - name: Aplicar somente auto-start e soft-kiosk
        run: python tools/patch_090_tvbox_kiosk.py

      - name: Normalizar imports após kiosk
        run: python tools/patch_0901_fix_imports.py

      - name: Versionar base corrigida 0.9.6
        run: python tools/patch_096_version_only.py

      - name: Reforçar auto-start no boot 0.9.7
        run: python tools/patch_097_boot_autostart.py

      - name: Corrigir descoberta e pré-pareamento 0.9.8
        run: python tools/patch_098_discovery_pairing.py

      - name: Probe robusto e diagnóstico 0.9.9
        run: python tools/patch_099_robust_probe.py

      - name: Validar rede, telemetria, proof, diagnóstico e auto-start
        shell: bash
        run: |
          FILE=app/src/main/java/com/conectasolucoes/conectasign/MainActivity.kt
          BOOT=app/src/main/java/com/conectasolucoes/conectasign/BootReceiver.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          GRADLE=app/build.gradle.kts
          grep -q '/api/player/config' "$FILE"
          grep -q '/api/player/heartbeat' "$FILE"
          grep -q '/api/player/proof' "$FILE"
          grep -q '/api/health' "$FILE"
          grep -q '8787..8810' "$FILE"
          grep -q 'discoveryDiagnostic' "$FILE"
          grep -q 'manufacturer' "$FILE"
          grep -q 'androidVersion' "$FILE"
          grep -q 'storageTotalMB' "$FILE"
          grep -q 'currentMediaId' "$FILE"
          grep -q 'currentPlaylistId' "$FILE"
          grep -q 'wifiRssi' "$FILE"
          grep -q 'playlistID' "$FILE"
          grep -q 'mediaID' "$FILE"
          grep -q 'BOOT_COMPLETED' "$BOOT"
          grep -q 'LOCKED_BOOT_COMPLETED' "$BOOT"
          grep -q 'MY_PACKAGE_REPLACED' "$BOOT"
          grep -q 'QUICKBOOT_POWERON' "$BOOT"
          grep -q 'setAndAllowWhileIdle' "$BOOT"
          grep -q 'directBootAware="true"' "$MANIFEST"
          grep -q 'versionName = "0.9.9"' "$GRADLE"
          echo 'OK: descoberta robusta, telemetria, proof e auto-start presentes.'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Conecta-Midia-Player-0.9.9-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Midia-Player-0.9.9-APK
          path: Conecta-Midia-Player-0.9.9-debug.apk
          if-no-files-found: error
