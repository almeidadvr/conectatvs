name: Gerar APK Conecta Mídia 0.9.0

on:
  workflow_dispatch:
  push:
    branches: [ main, master, player-0.9.0-ui-8799 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Conecta-Midia-Player-0.9.0-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Midia-Player-0.9.0-APK
          path: Conecta-Midia-Player-0.9.0-debug.apk
          if-no-files-found: error
