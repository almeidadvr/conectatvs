name: Gerar APK Conecta Mídia

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Aplicar melhorias de reprodução 0.5.4
        run: python tools/patch_052.py

      - name: Aplicar melhorias profissionais 0.6.0
        run: python tools/patch_060_extra.py

      - name: Aplicar telemetria 0.6.3
        run: python tools/patch_063_device.py

      - name: Aplicar marca d'água 0.7.1
        run: python tools/patch_071_watermark.py

      - name: Aplicar suporte a logo específica 0.8.2
        run: python tools/patch_082_watermark_url.py

      - name: Melhorar compatibilidade de vídeo 0.8.5
        run: python tools/patch_085_video_compat.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Conecta-Midia-0.8.5-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Midia-0.8.5-APK
          path: Conecta-Midia-0.8.5-debug.apk
          if-no-files-found: error
