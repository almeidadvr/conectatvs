name: Gerar APK Conecta Mídia 0.10.5

on:
  workflow_dispatch:
  push:
    branches: [ player-0.10.0-functional-093-autostart ]
    paths:
      - 'app/src/main/res/drawable/logo_conecta_transparente.png'
      - 'app/build.gradle.kts'
      - '.github/workflows/build-apk-0105.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Garantir que layout e funções não mudaram desde 0.10.4
        shell: bash
        run: |
          set -e
          BASE=74debba06a07c63896ee8fa8ab302dddd3f608a2
          git diff --exit-code $BASE..HEAD -- \
            app/src/main/res/layout/activity_main.xml \
            app/src/main/res/layout-land/activity_main.xml \
            app/src/main/res/drawable/player_background.xml \
            app/src/main/res/drawable/panel_bg_new.xml \
            app/src/main/res/drawable/ic_wifi_modern.xml \
            app/src/main/java/com/conectasolucoes/conectasign/MainActivity.kt \
            app/src/main/java/com/conectasolucoes/conectasign/BootReceiver.kt \
            app/src/main/AndroidManifest.xml

      - name: Aplicar somente carregamento seguro da logo
        run: python tools/patch_0104_logo_runtime.py

      - name: Validar logo e funções preservadas
        shell: bash
        run: |
          set -e
          FILE=app/src/main/java/com/conectasolucoes/conectasign/MainActivity.kt
          LAND=app/src/main/res/layout-land/activity_main.xml
          LOGO=app/src/main/res/drawable/logo_conecta_transparente.png
          GRADLE=app/build.gradle.kts
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('app/src/main/res/drawable/logo_conecta_transparente.png')
          b=p.read_bytes()
          assert len(b) > 5000, f'logo pequena demais: {len(b)} bytes'
          assert b[:8] == b'\x89PNG\r\n\x1a\n', 'logo não é PNG real'
          assert b[12:16] == b'IHDR', 'IHDR ausente'
          w,h,bit_depth,color_type = struct.unpack('>IIBB', b[16:26])
          assert w >= 500 and h >= 100, f'dimensões inadequadas: {w}x{h}'
          has_trns = b'tRNS' in b
          assert color_type in (4,6) or (color_type == 3 and has_trns), f'PNG sem transparência válida: tipo {color_type}'
          print(f'LOGO OK: PNG {w}x{h}, transparência presente, {len(b)} bytes')
          PY
          ! grep -q 'Player para Android TV' "$LAND"
          ! grep -q 'Código deste dispositivo' "$LAND"
          grep -q 'android:id="@+id/brandLogo"' "$LAND"
          grep -q 'android:layout_width="190dp"' "$LAND"
          grep -q 'android:layout_height="58dp"' "$LAND"
          grep -q 'android:layout_marginTop="-5dp"' "$LAND"
          grep -q 'android:src="@drawable/ic_wifi_modern"' "$LAND"
          grep -q 'setImageResource(R.drawable.logo_conecta_transparente)' "$FILE"
          ! grep -q 'brandLogo.visibility=View.GONE' "$FILE"
          grep -q ':8799' "$FILE"
          grep -q '/api/state' "$FILE"
          grep -q '/api/tvs' "$FILE"
          grep -q 'playSequence' "$FILE"
          grep -q 'currentMediaId' "$FILE"
          grep -q 'currentPlaylistId' "$FILE"
          grep -q 'wifiRssi' "$FILE"
          grep -q 'versionName = "0.10.5"' "$GRADLE"
          grep -q 'versionCode = 35' "$GRADLE"
          echo 'OK: logo aplicada no fonte; layout e funções preservados.'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK pelo Gradle
        run: gradle :app:assembleDebug --stacktrace

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'resources.arsc'
          cp "$APK" Conecta-Midia-Player-0.10.5-debug.apk
          echo "APK GRADLE OK: $(stat -c%s Conecta-Midia-Player-0.10.5-debug.apk) bytes"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Midia-Player-0.10.5-APK
          path: Conecta-Midia-Player-0.10.5-debug.apk
          if-no-files-found: error
