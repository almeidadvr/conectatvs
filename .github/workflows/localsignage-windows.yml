name: LocalSignage - Build Windows

on:
  workflow_dispatch:
  push:
    branches: ["localsignage-1.0"]
    paths:
      - "localsignage-package/**"
      - ".github/workflows/localsignage-windows.yml"
  pull_request:
    paths:
      - "localsignage-package/**"
      - ".github/workflows/localsignage-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir e extrair código-fonte
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          $parts = Get-ChildItem "localsignage-package/source.b64.part-*" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $b64 = $b64 -replace '\s',''
          [IO.File]::WriteAllBytes("$PWD\LocalSignage-1.0-source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path LocalSignage-1.0-source.zip -DestinationPath buildsrc -Force

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: buildsrc/localsignage/console/requirements.txt

      - name: Aplicar interface 1.0.1 - acesso e licenciamento
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("buildsrc/localsignage/console/static/app.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace("const pages=[['dashboard','Dashboard'],['devices','Telas'],['groups','Grupos'],['media','Mídias'],['playlists','Playlists'],['schedules','Agendamentos'],['reports','Proof of Play'],['commands','Comandos'],['users','Usuários'],['settings','Configurações']];", "const pages=[['dashboard','Dashboard'],['devices','Telas'],['groups','Grupos'],['media','Mídias'],['playlists','Playlists'],['schedules','Agendamentos'],['reports','Proof of Play'],['commands','Comandos'],['access','Controle de Acesso'],['license','Licenciamento'],['settings','Configurações']];")
          access = '''if(S.page==='access'){let u=await api('/users');c.innerHTML=`<div class=card section><div class=top><div><h3>Controle de Acesso</h3><p class=muted>Gerencie quem pode entrar no console. Administradores controlam usuários, licença e configurações; Operadores acessam a operação diária.</p></div><button class=primary onclick=userModal()>Novo usuário</button></div></div><table class=table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Criado em</th><th>Ações</th></tr>${u.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td><span class=pill>${x.role==='admin'?'Administrador':'Operador'}</span></td><td><span class="pill ${x.active?'online':'offline'}">${x.active?'Ativo':'Bloqueado'}</span></td><td>${esc(x.created_at||'-')}</td><td><button class=ghost onclick='editUser(${JSON.stringify(x)})'>Editar</button> <button class=ghost onclick='toggleUser(${JSON.stringify(x)})'>${x.active?'Bloquear':'Ativar'}</button> <button class=danger onclick='deleteUser(${x.id})'>Excluir</button></td></tr>`).join('')}</table>`}'''
          s = re.sub(r"if\(S\.page==='users'\)\{.*?\}\nif\(S\.page==='settings'\)", access + "\nif(S.page==='settings')", s, count=1, flags=re.S)
          oldlic = '''<div class=card section><h3>Licença</h3><p>Status: <b>${x.license.status}</b></p><button class=primary onclick="setLicense('active')">Ativar</button> <button class=danger onclick="setLicense('suspended')">Suspender sistema</button></div>'''
          s = s.replace(oldlic, '')
          marker = "if(S.page==='settings'){let x=await api('/settings'),b=await api('/backups');let s=x.settings;"
          licpage = '''if(S.page==='license'){let x=await api('/settings'),lic=x.license||{};c.innerHTML=`<div class=grid><div class="card stat"><span>Status atual</span><b>${lic.status==='active'?'ATIVA':'SUSPENSA'}</b><small>${lic.status==='active'?'Sistema liberado para operação':'Players recebem tela de sistema suspenso'}</small></div><div class="card stat"><span>Ativada em</span><b style="font-size:16px">${esc(lic.activated_at||'-')}</b></div><div class="card stat"><span>Suspensa em</span><b style="font-size:16px">${esc(lic.suspended_at||'-')}</b></div></div><div class=card style="margin-top:14px"><h3>Controle de Licenciamento</h3><p class=muted>A suspensão é global: o console continua acessível ao administrador, mas os aplicativos exibem a tela de sistema suspenso.</p><div class=field><label>Observações</label><textarea id=licnotes rows=4 placeholder="Motivo, cliente, contrato ou observação administrativa">${esc(lic.notes||'')}</textarea></div><div class=toolbar><button class=primary onclick="setLicense('active')">Ativar sistema</button><button class=danger onclick="setLicense('suspended')">Suspender sistema</button></div></div>`}\n'''
          if licpage not in s:
              s = s.replace(marker, licpage + marker)
          oldmodal = '''window.userModal=()=>{let z=modal(`<h3>Novo usuário</h3><input id=n placeholder=Nome><input id=e placeholder=E-mail><input id=p type=password placeholder=Senha><select id=r><option value=operator>Operador</option><option value=admin>Administrador</option></select><button class=primary id=ok>Criar</button>`);z.querySelector('#ok').onclick=async()=>{await api('/users',{method:'POST',body:{name:z.querySelector('#n').value,email:z.querySelector('#e').value,password:z.querySelector('#p').value,role:z.querySelector('#r').value}});z.remove();render()}}'''
          newmodal = '''window.userModal=()=>{let z=modal(`<h3>Novo usuário</h3><div class=field><label>Nome</label><input id=n placeholder="Nome completo"></div><div class=field><label>E-mail</label><input id=e type=email placeholder="usuario@local"></div><div class=field><label>Senha</label><input id=p type=password placeholder="Senha inicial"></div><div class=field><label>Perfil</label><select id=r><option value=operator>Operador</option><option value=admin>Administrador</option></select></div><button class=primary id=ok>Criar usuário</button>`);z.querySelector('#ok').onclick=async()=>{await api('/users',{method:'POST',body:{name:z.querySelector('#n').value,email:z.querySelector('#e').value,password:z.querySelector('#p').value,role:z.querySelector('#r').value}});z.remove();render()}}
          window.editUser=x=>{let z=modal(`<h3>Editar usuário</h3><div class=field><label>Nome</label><input id=n value="${esc(x.name)}"></div><div class=field><label>E-mail</label><input id=e type=email value="${esc(x.email)}"></div><div class=field><label>Nova senha <span class=muted>(deixe vazio para manter)</span></label><input id=p type=password></div><div class=field><label>Perfil</label><select id=r><option value=operator>Operador</option><option value=admin>Administrador</option></select></div><div class=field><label><input id=a type=checkbox style="width:auto" ${x.active?'checked':''}> Usuário ativo</label></div><button class=primary id=ok>Salvar alterações</button>`);z.querySelector('#r').value=x.role;z.querySelector('#ok').onclick=async()=>{let body={name:z.querySelector('#n').value,email:z.querySelector('#e').value,role:z.querySelector('#r').value,active:z.querySelector('#a').checked?1:0};if(z.querySelector('#p').value)body.password=z.querySelector('#p').value;await api('/users/'+x.id,{method:'PUT',body});z.remove();render()}}
          window.toggleUser=async x=>{await api('/users/'+x.id,{method:'PUT',body:{active:x.active?0:1}});toast(x.active?'Usuário bloqueado':'Usuário ativado');render()}
          window.deleteUser=async id=>{if(confirm('Excluir este usuário? Esta ação não pode ser desfeita.')){try{await api('/users/'+id,{method:'DELETE'});toast('Usuário excluído');render()}catch(e){toast(e.message,true)}}}'''
          s = s.replace(oldmodal, newmodal)
          s = re.sub(r"window\.setLicense=async status=>\{if\(confirm\('Alterar licença para '\+status\+'\?'\)\)\{await api\('/license',\{method:'PUT',body:\{status\}\}\);render\(\)\}\}", "window.setLicense=async status=>{let msg=status==='active'?'Ativar o sistema e liberar todos os players?':'Suspender o sistema inteiro? Os players exibirão a tela de sistema suspenso.';if(confirm(msg)){await api('/license',{method:'PUT',body:{status,notes:$('#licnotes')?.value||''}});toast(status==='active'?'Sistema ativado':'Sistema suspenso');render()}}", s)
          p.write_text(s, encoding="utf-8")
          assert "Controle de Acesso" in s and "Controle de Licenciamento" in s and "window.editUser" in s

      - name: Validar JavaScript da interface
        shell: pwsh
        run: node --check buildsrc/localsignage/console/static/app.js

      - name: Instalar dependências de build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r buildsrc/localsignage/console/requirements.txt
          pip install pyinstaller

      - name: Criar launcher do Console
        shell: pwsh
        run: |
          @'
          import os
          import uvicorn
          from localsignage.app import app
          if __name__ == "__main__":
              uvicorn.run(app, host=os.getenv("LOCALSIGNAGE_HOST", "0.0.0.0"), port=int(os.getenv("LOCALSIGNAGE_PORT", "8765")), log_level="info")
          '@ | Set-Content -Encoding UTF8 buildsrc/launcher.py

      - name: Gerar executável do Console
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name LocalSignageConsole `
            --paths buildsrc/localsignage/console `
            --add-data "buildsrc/localsignage/console/static;static" `
            --collect-all zeroconf `
            buildsrc/launcher.py

      - name: Preparar instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          @'
          $ErrorActionPreference = "Stop"
          $appDir = Join-Path $env:ProgramFiles "LocalSignage"
          $dataDir = Join-Path $env:ProgramData "LocalSignage"
          New-Item -ItemType Directory -Force $dataDir, (Join-Path $dataDir "media"), (Join-Path $dataDir "Backups") | Out-Null
          $launcher = Join-Path $appDir "start-localsignage.cmd"
          $taskName = "LocalSignage Console"
          schtasks /Delete /TN $taskName /F 2>$null | Out-Null
          schtasks /Create /TN $taskName /SC ONSTART /RU SYSTEM /RL HIGHEST /TR ('"' + $launcher + '"') /F | Out-Null
          schtasks /Run /TN $taskName | Out-Null
          '@ | Set-Content -Encoding UTF8 installer/install-service.ps1

          @'
          @echo off
          set "LOCALSIGNAGE_DATA=%ProgramData%\LocalSignage"
          cd /d "%~dp0"
          "%~dp0LocalSignageConsole\LocalSignageConsole.exe"
          '@ | Set-Content -Encoding ASCII installer/start-localsignage.cmd

          @'
          [Setup]
          AppId={{D5E8490E-5D34-48E5-A992-2F0A0A1C9A10}
          AppName=LocalSignage
          AppVersion=1.0.1
          DefaultDirName={autopf}\LocalSignage
          DefaultGroupName=LocalSignage
          PrivilegesRequired=admin
          OutputDir=output
          OutputBaseFilename=LocalSignage-Setup-1.0.1
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=LocalSignage 1.0.1

          [Files]
          Source: "..\dist\LocalSignageConsole\*"; DestDir: "{app}\LocalSignageConsole"; Flags: recursesubdirs createallsubdirs ignoreversion
          Source: "start-localsignage.cmd"; DestDir: "{app}"; Flags: ignoreversion
          Source: "install-service.ps1"; DestDir: "{app}"; Flags: ignoreversion

          [Dirs]
          Name: "{commonappdata}\LocalSignage"
          Name: "{commonappdata}\LocalSignage\media"
          Name: "{commonappdata}\LocalSignage\Backups"

          [Run]
          Filename: "powershell.exe"; Parameters: "-NoProfile -ExecutionPolicy Bypass -File ""{app}\install-service.ps1"""; Flags: runhidden waituntilterminated

          [UninstallRun]
          Filename: "schtasks.exe"; Parameters: "/Delete /TN ""LocalSignage Console"" /F"; Flags: runhidden; RunOnceId: "RemoveLocalSignageTask"
          '@ | Set-Content -Encoding UTF8 installer/LocalSignage-CI.iss

      - name: Instalar Inno Setup se necessário
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Compilar instalador EXE
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\LocalSignage-CI.iss'

      - name: Teste básico do executável
        shell: pwsh
        run: |
          $env:LOCALSIGNAGE_DATA = "$PWD\smoke-data"
          $stdout = "$PWD\smoke-stdout.log"
          $stderr = "$PWD\smoke-stderr.log"
          $exe = "$PWD\dist\LocalSignageConsole\LocalSignageConsole.exe"
          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ok = $false
          try {
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { break }
              try {
                $r = Invoke-RestMethod -Uri http://127.0.0.1:8765/api/health -TimeoutSec 2
                if ($r.ok -eq $true) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              if ($p.HasExited) { throw "Console encerrou com código $($p.ExitCode)" }
              throw "Console não respondeu ao health check em 20 segundos"
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: SHA-256
        shell: pwsh
        run: |
          $f = "installer\output\LocalSignage-Setup-1.0.1.exe"
          (Get-FileHash $f -Algorithm SHA256).Hash + "  LocalSignage-Setup-1.0.1.exe" | Set-Content installer\output\LocalSignage-Setup-1.0.1.sha256

      - name: Publicar artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: LocalSignage-Windows-1.0.1
          path: |
            installer/output/LocalSignage-Setup-1.0.1.exe
            installer/output/LocalSignage-Setup-1.0.1.sha256
          if-no-files-found: error
